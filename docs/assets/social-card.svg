<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HandOff-OS social card</title>
  <desc id="desc">A launch card for HandOff-OS showing AI chat as scratch and durable project state as the recovery layer.</desc>
  <rect width="1200" height="630" rx="0" fill="#0f172a"/>
  <rect x="72" y="72" width="1056" height="486" rx="32" fill="#111827" stroke="#334155" stroke-width="3"/>
  <text x="110" y="150" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">HandOff-OS</text>
  <text x="110" y="205" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1">Your AI forgets. Your projects don't have to.</text>

  <g transform="translate(110 270)">
    <rect x="0" y="0" width="280" height="160" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Chat</text>
    <text x="28" y="86" font-family="Inter, Arial, sans-serif" font-size="19" fill="#cbd5e1">scratch</text>
    <text x="28" y="118" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">long, stale, fragile</text>
  </g>

  <g transform="translate(460 270)">
    <rect x="0" y="0" width="280" height="160" rx="20" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
    <text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Durable state</text>
    <text x="28" y="86" font-family="Inter, Arial, sans-serif" font-size="19" fill="#ccfbf1">Markdown files</text>
    <text x="28" y="118" font-family="Inter, Arial, sans-serif" font-size="17" fill="#99f6e4">context + history</text>
  </g>

  <g transform="translate(810 270)">
    <rect x="0" y="0" width="280" height="160" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Fresh AI chat</text>
    <text x="28" y="86" font-family="Inter, Arial, sans-serif" font-size="19" fill="#cbd5e1">resumes</text>
    <text x="28" y="118" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">without guessing</text>
  </g>

  <path d="M400 350 L445 350" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 335 L445 350 L430 365" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M750 350 L795 350" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M780 335 L795 350 L780 365" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="110" y="505" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Project memory and handoffs for ChatGPT, Claude Code, Cursor, and Codex workflows.</text>
</svg>
