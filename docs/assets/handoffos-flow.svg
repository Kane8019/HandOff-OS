<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="HandoffOS visual: messy AI chat becomes durable Markdown state, then a fresh chat recovers the project.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <filter id="softlite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>

  <!-- ===== Header ===== -->
  <text x="72" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-0.5">HandoffOS</text>
  <text x="74" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#334155">Your AI forgets. Your projects don't have to.</text>
  <text x="74" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">Durable project state for AI-assisted work</text>

  <!-- accent underline under wordmark -->
  <rect x="74" y="98" width="118" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- ===== LEFT: messy fading chat stack ===== -->
  <g opacity="0.42">
    <!-- back bubble -->
    <g transform="translate(96 300) rotate(-7)">
      <rect x="0" y="0" width="210" height="74" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#softlite)"/>
      <text x="22" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">cold start</text>
    </g>
  </g>
  <g opacity="0.62">
    <!-- middle bubble -->
    <g transform="translate(80 250) rotate(-3)">
      <rect x="0" y="0" width="230" height="78" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#softlite)"/>
      <text x="22" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">lost decisions</text>
    </g>
  </g>
  <g opacity="0.92">
    <!-- front bubble -->
    <g transform="translate(72 196)">
      <rect x="0" y="0" width="244" height="82" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#soft)"/>
      <path d="M40 82 L40 110 L72 82 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
      <text x="24" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">long chat</text>
    </g>
  </g>
  <text x="194" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8" text-anchor="middle" font-style="italic">chat is scratch</text>

  <!-- Arrow left -> center -->
  <g opacity="0.7">
    <line x1="332" y1="320" x2="420" y2="320" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
    <path d="M418 305 L446 320 L418 335 Z" fill="#818cf8"/>
  </g>

  <!-- ===== CENTER: hero durable state card ===== -->
  <g filter="url(#soft)">
    <rect x="466" y="176" width="350" height="320" rx="26" fill="url(#hero)" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <!-- header band -->
  <rect x="466" y="176" width="350" height="64" rx="26" fill="url(#accent)"/>
  <rect x="466" y="214" width="350" height="26" fill="#ffffff" opacity="0"/>
  <rect x="466" y="214" width="350" height="26" fill="url(#accent)"/>
  <text x="498" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Durable State</text>

  <!-- file chip 1 -->
  <rect x="498" y="264" width="286" height="50" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="514" y="280" width="16" height="18" rx="2" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="518" y1="286" x2="526" y2="286" stroke="#4f46e5" stroke-width="2"/>
  <line x1="518" y1="291" x2="526" y2="291" stroke="#4f46e5" stroke-width="2"/>
  <text x="546" y="296" font-family="Consolas, Menlo, monospace" font-size="20" fill="#1e293b">project-context.md</text>

  <!-- file chip 2 -->
  <rect x="498" y="322" width="286" height="50" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="514" y="338" width="16" height="18" rx="2" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="518" y1="344" x2="526" y2="344" stroke="#4f46e5" stroke-width="2"/>
  <line x1="518" y1="349" x2="526" y2="349" stroke="#4f46e5" stroke-width="2"/>
  <text x="546" y="354" font-family="Consolas, Menlo, monospace" font-size="20" fill="#1e293b">history-log.md</text>

  <!-- bullets -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#475569">
    <circle cx="508" cy="408" r="4" fill="#4f46e5"/>
    <text x="522" y="414">decisions</text>
    <circle cx="508" cy="438" r="4" fill="#4f46e5"/>
    <text x="522" y="444">next action</text>
    <circle cx="508" cy="468" r="4" fill="#4f46e5"/>
    <text x="522" y="474">boundaries</text>
  </g>

  <!-- Arrow center -> right -->
  <g opacity="0.85">
    <line x1="836" y1="320" x2="924" y2="320" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M922 305 L950 320 L922 335 Z" fill="#4f46e5"/>
  </g>

  <!-- ===== RIGHT: recovered project card ===== -->
  <g filter="url(#soft)">
    <rect x="968" y="200" width="244" height="272" rx="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <!-- top accent bar -->
  <rect x="968" y="200" width="244" height="8" rx="4" fill="url(#accent)"/>
  <!-- status dot -->
  <circle cx="996" cy="244" r="7" fill="#22c55e"/>
  <text x="1014" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Recovered in 60s</text>

  <line x1="992" y1="272" x2="1188" y2="272" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#334155">
    <path d="M992 306 l8 8 l16 -18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1026" y="312">same decisions</text>
    <path d="M992 350 l8 8 l16 -18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1026" y="356">same boundaries</text>
    <path d="M992 394 l8 8 l16 -18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1026" y="400">next action ready</text>
  </g>

  <!-- ===== Footer ===== -->
  <text x="640" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">local-only · markdown state · MIT</text>
</svg>
