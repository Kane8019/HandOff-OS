[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffos"
version = "0.1.0"
description = "A lightweight project-memory and handoff layer for AI-assisted work."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HandoffOS contributors" }]
keywords = ["ai", "memory", "handoff", "workflow", "llm", "claude", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
handoffos = "handoffos.cli:main"

[tool.setuptools]
packages = ["handoffos", "handoffos.templates"]

[tool.setuptools.package-data]
"handoffos.templates" = ["*.md"]
